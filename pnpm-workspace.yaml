packages:
    - worker
allowBuilds:
    esbuild: false
    '@parcel/watcher': false
    workerd: true
# Our own packages are published by our own CI, so they skip pnpm's
# minimum-release-age gate. Without this, a parser fix released minutes ago
# could not be installed until the next day.
minimumReleaseAgeExclude:
    - '@tabularis/*'
saveExact: true
